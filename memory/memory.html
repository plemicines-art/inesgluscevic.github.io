<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Geometry Dash</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --fond: #2a1245;
  --rose: #f7d3e1;
  --framboise: #c9457a;
  --jaune: #ffe08a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(160deg, var(--fond), #5b2a86);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 5%;
}

.retour {
  align-self: flex-start;
  color: var(--rose);
  text-decoration: none;
  font-size: 14px;
}

.retour:hover {
  text-decoration: underline;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 52px);
  margin: 20px 0 10px;
  text-align: center;
}

h1 span {
  color: var(--jaune);
}

.regle {
  max-width: 450px;
  text-align: center;
  line-height: 1.7;
  margin-bottom: 25px;
}

.infos {
  display: flex;
  gap: 15px;
  margin-bottom: 25px;
}

.infos div {
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid var(--rose);
  border-radius: 30px;
  padding: 8px 20px;
  font-weight: 700;
}

/* La grille de 4 colonnes */
.plateau {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  width: min(100%, 460px);
}

.carte {
  aspect-ratio: 1;
  border: none;
  background: none;
  cursor: pointer;
  perspective: 600px;   /* donne un effet 3D au retournement */
}

.carte-interieur {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transition: transform 0.4s;
  transform-style: preserve-3d;
}

/* La carte retournée (ou trouvée) pivote */
.carte.retournee .carte-interieur,
.carte.trouvee .carte-interieur {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  backface-visibility: hidden;
  border: 3px solid var(--rose);
}

.dos {
  background: linear-gradient(135deg, var(--framboise), #7d5ad6);
  font-size: 30px;
  font-weight: 700;
}

.devant {
  background: white;
    transform: rotateY(180deg);
}

.devant img {
  width: 82%;
  height: 82%;
  object-fit: contain;
}

.carte.trouvee .devant {
  background: var(--jaune);
  border-color: var(--jaune);
}

.carte:focus-visible {
  outline: 3px solid var(--jaune);
  outline-offset: 3px;
  border-radius: 12px;
}

.message {
  min-height: 60px;
  margin: 25px 0 10px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--jaune);
}

.btn {
  background: var(--framboise);
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 30px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #a54468;
  transform: translateY(-3px);
}

@media (prefers-reduced-motion: reduce) {
  .carte-interieur,
  .btn {
    transition: none;
  }
}
</style>
</head>

  plateau.innerHTML = '';

  // On double les symboles pour faire des paires, puis on mélange
  const cartes = [...faces, ...faces];
  cartes.sort(() => Math.random() - 0.5);

  cartes.forEach(face => {
    const carte = document.createElement('button');
    carte.className = 'carte';
    carte.dataset.symbole = face.nom;
    carte.setAttribute('aria-label', 'Carte cachée');
    carte.innerHTML =
      '<span class="carte-interieur">' +
        '<span class="face dos">?</span>' +
        '<span class="face devant"><img src="' + face.image + '" alt="' + face.nom + '"></span>' +
      '</span>';
    carte.addEventListener('click', () => cliquer(carte));
    plateau.appendChild(carte);
  });
}

function cliquer(carte) {
  if (bloque) return;
  if (carte.classList.contains('retournee') || carte.classList.contains('trouvee')) return;

  // Le chrono démarre au premier clic
  if (chrono === null) {
    chrono = setInterval(() => {
      secondes++;
      tempsEl.textContent = secondes;
    }, 1000);
  }

  carte.classList.add('retournee');

  if (premiereCarte === null) {
    premiereCarte = carte;
    return;
  }

  // Deuxième carte : on compte un coup et on compare
  coups++;
  coupsEl.textContent = coups;

  if (premiereCarte.dataset.symbole === carte.dataset.symbole) {
    premiereCarte.classList.replace('retournee', 'trouvee');
    carte.classList.replace('retournee', 'trouvee');
    premiereCarte = null;
    paires++;
    if (paires === faces.length) gagner();
  } else {
    bloque = true;
    const autre = premiereCarte;
    premiereCarte = null;
    setTimeout(() => {
      autre.classList.remove('retournee');
      carte.classList.remove('retournee');
      bloque = false;
    }, 900);
  }
}

function gagner() {
  clearInterval(chrono);
  messageEl.textContent = 'Bravo ! Tu as gagné en ' + coups + ' coups et ' + secondes + ' secondes.';
}

document.getElementById('rejouer').addEventListener('click', demarrer);
demarrer();
</script>

</body>
